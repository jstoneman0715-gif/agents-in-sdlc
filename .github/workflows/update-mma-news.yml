name: Update MMA News Twice Daily

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: ./website

      - name: Fetch MMA news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-mma-news.js
        working-directory: ./website

      - name: Commit and push changes
        run: |
          cd website
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/mma-news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update MMA news" && git push)

      - name: Build site
        run: npm run build
        working-directory: ./website

      - name: Deploy to fightonomics GitHub Pages
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -e
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          if [ -z "$PAGES_TOKEN" ]; then
            echo "⚠️  PAGES_DEPLOY_TOKEN not configured. Skipping deployment."
            exit 0
          fi

          TARGET_REPO="https://oauth2:${PAGES_TOKEN}@github.com/jstoneman0715-gif/fightonomics.git"
          TMP_DIR=$(mktemp -d)

          echo "Cloning target repo..."
          git clone "$TARGET_REPO" "$TMP_DIR" --depth 1 2>/dev/null || (echo "Initializing empty repo" && mkdir -p "$TMP_DIR" && git init "$TMP_DIR")

          echo "Copying built site..."
          rm -rf "$TMP_DIR"/*
          cp -R website/dist/. "$TMP_DIR/"

          cd "$TMP_DIR"
          git add --all
          git commit -m "chore: deploy site from agents-in-sdlc (automated)" || echo "No changes to commit"

          echo "Pushing to main branch..."
          git push "$TARGET_REPO" HEAD:main --force 2>&1 | grep -v token
